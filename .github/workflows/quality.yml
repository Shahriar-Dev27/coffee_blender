name: BREOU quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run fonts:check
      - run: npm run assets:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Production loading budgets
        run: |
          npm run start > /tmp/breou-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          npm run budget:js
          npm run audit:mobile
